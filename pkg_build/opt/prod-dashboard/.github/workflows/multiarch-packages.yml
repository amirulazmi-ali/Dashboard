name: Build multi-arch packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rsync python3-venv
          gem install --user-install fpm || true
          export PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH"

      - name: Determine arch
        run: echo "ARCH=${{ matrix.platform }}" >> $GITHUB_ENV

      - name: Build package with build_fpm.sh
        env:
          FPM_ARCH: ${{ matrix.platform }}
        run: |
          chmod +x ./build_fpm.sh
          ./build_fpm.sh ${GITHUB_REF_NAME:-1.0.0} deb

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-dashboard-${{ matrix.platform }}-deb
          path: "prod-dashboard_*_${{ matrix.platform }}*.deb"
